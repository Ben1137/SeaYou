# P6.2 — Autonomous calibration data-assimilation pipeline
# Runs every 6h to collect engine-vs-buoy residuals into calibration_residuals.
# Secrets required in GitHub repo Settings → Secrets and variables → Actions:
#   SUPABASE_URL            — https://mxuvijlowneokmzeompn.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service_role JWT (NOT the anon key)
# The workflow writes to Supabase but commits nothing.
name: Calibration Data Assimilation

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger via GitHub Actions UI

jobs:
  assimilate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Minimal permissions — workflow only writes to Supabase (external), never to the repo.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run data assimilation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx packages/core/src/nearshore/dataAssimilation.ts
